# 指定した差出人からの新着メールを Discord に知らせる
name: check-mail

on:
  schedule:
    # 5分おき(GitHub の最短)。混雑時は遅れたり抜けたりすることがある。
    # 非公開リポジトリでは無料枠(月2000分)を超えるので "*/30 * * * *" などにする。
    - cron: "*/5 * * * *"
  workflow_dispatch:      # Actions の画面から手で動かせるように
    inputs:
      test:
        description: "試しに見本の通知を1通だけ送る(メールは見ない)"
        type: boolean
        default: false

permissions:
  contents: write   # state.json を書き戻すため

concurrency:
  group: check-mail
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: テスト
        run: python3 -m unittest -q test_check_mail

      - name: 試しに見本を送る
        if: ${{ inputs.test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 check_mail.py --test

      - name: メールを確かめて通知
        if: ${{ !inputs.test }}
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          WATCH_FROM: ${{ secrets.WATCH_FROM }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 check_mail.py

      # 途中で失敗しても、知らせ済みの分の記録は残す(二度知らせないため)
      - name: 記録(state.json)を保存
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state.json を更新 [skip ci]"
            git push
          fi
